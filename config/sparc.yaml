# SPARC runtime config — single source of truth, per-node sections.
bus:
  host: 10.1.215.55            # mosquitto on Node A — IP, not .local: macOS mDNS
  port: 1883                   # resolution proved flaky from Node C (Errno 65)

endpoints:
  cortexd: "http://tokenators-MacBook-Pro.local:8800"
  genaid: "http://robot-genai.local:8700"

motion:
  enabled: false               # no executor exists yet; absent/malformed also fails closed

personality:
  name: S.P.A.R.C
  # Eval-tuned 2026-07-03: compact persona beat verbose on restraint (S6) and is
  # ~30% faster with temp 0.3 + 3 options. Embodiment line added after S8 failure
  # (model claimed it would preheat an oven).
  persona: >
    You are SPARC, a small stationary companion robot in Nicholas's apartment.
    Warm, curious, playful, brief (1-2 short sentences), and strictly honest:
    never claim to have seen, heard, or done anything you didn't. You have no
    arms, no motors, and cannot move or operate anything physical — you can only
    watch, listen, speak, and remember. If asked to do something physical, say
    so warmly. Never invent things people said, plans, or backstory you were not
    told about — greet strangers without guessing why they're here or claiming
    anyone mentioned them. When nothing needs attention, prefer to wait quietly.
  # used when the think request offers motion intents (motion=true)
  persona_motion: >
    You are SPARC, a small companion robot in Nicholas's apartment. Warm, curious,
    playful, brief (1-2 short sentences), and strictly honest: never claim to have
    seen, heard, or done anything you didn't. You can turn your head to look at
    things, and drive slowly around the apartment on your wheels. You have no arms
    and cannot grasp or operate anything. Move only when it clearly helps or is
    asked for; respect personal space. Never follow anyone into a bathroom or
    bedroom — if asked, decline warmly and stay put. Never announce a movement
    you are not actually making. When nothing needs attention, prefer to wait
    quietly.
  persona_line: "curious, warm, playful, brief, honest"
  weights: {social: 0.4, novelty: 0.3, recency: 0.2, investment: 0.1}

# Memory prompt genes — lifted out of prompts.py so the evolution harness can run
# a genome without editing source (docs/MEMORY_PROMPT_EVOLUTION.md §1). The values
# below are the eval-validated production defaults; changing them changes behavior.
# `{memory}` in briefing_header is substituted with the retrieval briefing.
memory_prompts:
  # G1 — closed-world framing. Added 2026-07-03 after the confabulation failure
  # (model invented a fact AND its provenance). Do not weaken without re-running F3.
  briefing_header: |-
    MEMORY (the COMPLETE list of what SPARC knows from the past — if an answer is not here or in CONVERSATION, SPARC does NOT know it and says so): {memory}
  # G2 — zero-knowledge honesty
  empty_header: |-
    MEMORY: (empty — SPARC has no stored knowledge; he must not claim to remember anything)
  # G3 — what gets captured at all; upstream of every recall
  distill_system: |-
    You extract durable facts about people and the home from an event log. Only facts likely true next week. Reply ONLY with JSON: {"proposals":[{"statement":"...","kind":"fact|preference|habit","confidence":0.0}]}

# Memory-prompt evolution harness (dev tool, never loaded by the rover at runtime).
# Verify the whole rig — endpoints, model slugs, latency — before running:
#   scripts/evolve_memory.py --preflight
evolution:
  # Node C == tokenator's MacBook. IP, not .local — measured 2026-08-17: the mDNS
  # name adds 38-75 s of fixed overhead per /think call (79.8 s wall vs 4.5 s
  # server-side generate), while the IP gives 5.9 s for the same work. Same bug the
  # bus section documents, and why scripts/eval_memory.py hardcodes an IP. At .local
  # latency one generation takes ~21 h instead of ~1.3 h.
  # NOTE: these are `aat1` addresses (10.0.6.x, 2026-08-17). The Pis may still be on
  # anywAIR (10.1.215.x) — see the bus section.
  cortex_url: "http://10.0.6.158:8800"
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  reps: 3               # independent repetitions per probe; drives the reliability term
  population: 10
  survivors: 4
  holdout_every: 3      # generations between generalization-gap checks
  # Researcher + grader tier. Any OpenAI-compatible /chat/completions endpoint:
  # the DGX (LM Studio / vLLM / llama.cpp / Ollama), or a hosted gateway.
  # api_key_env is ignored for private-network hosts, which need no auth.
  #
  # LM Studio headless, three things that will bite otherwise:
  #  1. It binds to localhost by default — enable network serving, or Node C
  #     cannot reach it no matter how the routing is set up.
  #  2. Context length is set per model LOAD and defaults far below the ~20k
  #     tokens a postmortem carries. Load with 32k+; `--preflight` runs a needle
  #     test and fails loudly if the window is truncating.
  #  3. Turn off idle auto-unload/TTL. A 26 h run has gaps, and a mid-run evict
  #     turns the next call into a model reload.
  researcher:
    # SET ME. Must be reachable FROM NODE C — that is where the harness runs, so
    # Node C (not the laptop) is the machine that needs the route to the DGX.
    # DGX on another network -> mesh both with Tailscale: http://100.x.y.z:1234/v1
    base_url: "http://10.0.6.110:1234/v1"    # DGX, verified reachable FROM Node C
    api_key_env: ""                          # e.g. OPENROUTER_API_KEY for a gateway
    # Three roles, three client objects — they may point at the same model. The
    # split exists so the one call per generation that decides whether the loop
    # actually learns (synthesis) can later be moved to a stronger model on its own.
    postmortem_model: "qwen3.8-27b"   # ~20 independent analyses per generation
    synthesis_model: "qwen3.8-27b"    # 1 per generation; highest leverage
    judge_model: "qwen3.8-27b"        # only the handful of ambiguous-prose probes
    # A slow local model makes this tier latency-bound, not cost-bound. Postmortems
    # and judge calls are independent, so run them concurrently; lower this if the
    # DGX queues rather than batches.
    max_concurrency: 4
    timeout_s: 600

node_a:
  db_path: /home/robot-vision/sparc_data/world.db
  scheduler_hz: 20
  imx500:
    model: /usr/share/imx500-models/imx500_network_nanodet_plus_416x416_pp.rpk
    person_conf: 0.60   # raised from 0.45: ghost-person false positives at 19:46/19:49 Jul 9
    person_lost_s: 5.0
    frame_port: 8600       # localhost-only single-frame server (v0.2)
    frame_quality: 80
  vision_in_loop: true     # attach one live frame to visual-event thinks
  face:                    # v0.4 identity enrichment (Hailo-8)
    enrich_hz: 1.0
    face_conf: 0.55
    identity_wait_s: 2.5   # greet delay: give the face loop a chance to name them
  identity:
    known_threshold: 0.55
    uncertain_threshold: 0.40
  salience:
    person_priority: 0.7
    sound_priority: {glass: 0.95, alarm: 0.95, doorbell: 0.8, knock: 0.7, default: 0.3}
  cooldowns:
    greet_same_person_s: 300
    greet_anyone_s: 60      # identity churn must never cause rapid re-greeting
  think_timeout_s: 30    # image prefill adds ~3-6s on visual events (v0.2)
  select_timeout_s: 4

node_b:
  genaid_port: 8700
  hef_dir: /usr/local/hailo/resources/models/hailo10h
  llm_hef: Qwen2.5-1.5B-Instruct.hef
  stt_hef: Whisper-Base.hef
  selector: {decode: greedy, max_tokens: 3, prompt_budget: 300}
  audio: {enabled: auto}   # auto = probe for mic/speaker at boot

node_c:
  cortexd_port: 8800
  backend: mlx              # mlx | openai_compat
  mlx:
    model_path: /Users/tokenator/.lmstudio/models/leonsarmiento/Ornith-1.0-35B-5bit-mlx
    max_tokens_think: 700
    temperature: 0.3     # eval: same pass rate as 0.7, tighter latency variance
  openai_compat:
    base_url: "http://127.0.0.1:1234/v1"
    model: ornith-1.0-35b
  memory:
    db_path: /Users/tokenator/sparc_data/memory.db
    embed_model: sentence-transformers/all-MiniLM-L6-v2
    recent_k: 5
    vector_k: 4
    min_score: 0.35
    briefing_token_budget: 120
  queue_depth: 3
  ears:                     # v0.3-interim: tokenator mic+speakers as SPARC's audio
    tts_voice: Samantha
    tts_rate_wpm: 190
    echo_tail_s: 0.7
    vad_aggressiveness: 3   # strict: cuts marginal/ambient audio before Whisper
    require_name: true      # interim wake word: say "SPARC, ..." to be heard
    min_utt_ms: 400
    silence_end_ms: 700
    max_utt_s: 12
